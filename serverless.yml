service: guima-backend-lambda

provider:
    name: aws
    region: sa-east-1 
    runtime: provided.al2
    apiGateway:
        binaryMediaTypes:
            - '*/*'
    environment:
        BREF_BINARY_RESPONSES: '1'
    iamRoleStatements:
        # Allow to put a file in the `my-bucket` S3 bucket
        -   Effect: Allow
            Action: 
                - s3:PutObject
                - s3:PutObjectAcl
                - s3:GetObject
                - s3:GetObjectAcl
                - s3:DeleteObject
            Resource: 'arn:aws:s3:::prod-guima-bucket/*'

plugins:
    - ./vendor/bref/bref
    - ./vendor/bref/extra-php-extensions

package:
  exclude:
    - node_modules/**
    - public/storage
    - resources/assets/**
    - storage/**
    - tests/**

functions:
    website:
        handler: public/index.php
        timeout: 28 # in seconds (API Gateway has a timeout of 29 seconds)
        layers:
            - ${bref:layer.php-81-fpm}
            - ${bref-extra:gd-php-81}
        events:
            -   http: 'ANY /'
            -   http: 'ANY /{proxy+}'
    artisan:
        handler: artisan
        timeout: 120 # in seconds
        layers:
            - ${bref:layer.php-81} # PHP
            - ${bref:layer.console} # The "console" layer